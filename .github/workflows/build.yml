
name: Build Luri Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/luri/keyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'LuriKeyboard'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.luri.keyboard'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.luri.keyboard'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Luri Keyboard"
                  android:theme="@android:style/Theme.Material.Light">
                  <service
                      android:name=".LuriIME"
                      android:label="Luri Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/method.xml <<'EOF'
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:isDefault="false"
              android:supportsSwitchingToNextInputMethod="true" />
          EOF

          cat > app/src/main/java/com/luri/keyboard/LuriIME.java <<'EOF'
          package com.luri.keyboard;

          import android.inputmethodservice.InputMethodService;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Gravity;
          import android.view.inputmethod.InputConnection;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class LuriIME extends InputMethodService {
              boolean english = false;

              @Override
              public View onCreateInputView() {
                  return keyboard();
              }

              LinearLayout keyboard() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(3, 4, 3, 4);
                  root.setBackgroundColor(Color.rgb(225, 230, 236));

                  String[][] rows = english
                      ? new String[][] {
                          {"q","w","e","r","t","y","u","i","o","p"},
                          {"a","s","d","f","g","h","j","k","l"},
                          {"⇧","z","x","c","v","b","n","m","⌫"},
                          {"?123","EN/LU",",","SPACE",".","↵"}
                        }
                      : new String[][] {
                          {"ا","ب","پ","ت","ج","چ","خ","د","ر","ز"},
                          {"ژ","س","ش","غ","ف","ق","ل","م","ن"},
                          {"و","ه","ی","ک","گ","ڡ","ڢ","ڤ","⌫"},
                          {"ڶ","ڹ","ۏ","ڔ","ݕ","ݖ","ݢ","ٮ","د̣","ی̇"},
                          {"وو","ا̇","EN/LU","SPACE","،","↵"}
                        };

                  for (String[] row : rows) {
                      LinearLayout line = new LinearLayout(this);
                      line.setGravity(Gravity.CENTER);
                      for (String key : row) {
                          Button b = new Button(this);
                          b.setText(key);
                          b.setTextSize(17);
                          b.setPadding(0, 0, 0, 0);
                          b.setAllCaps(false);
                          b.setMinWidth(0);
                          b.setMinimumWidth(0);
                          b.setMinHeight(0);
                          b.setMinimumHeight(0);
                          b.setTextColor(Color.BLACK);
                          b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.WHITE));
                          LinearLayout.LayoutParams p =
                              new LinearLayout.LayoutParams(0, 48, 1);
                          p.setMargins(2, 2, 2, 2);
                          line.addView(b, p);
                          b.setOnClickListener(v -> press(key));
                      }
                      root.addView(line, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));
                  }
                  return root;
              }

              void press(String key) {
                  InputConnection ic = getCurrentInputConnection();
                  if (key.equals("EN/LU")) {
                      english = !english;
                      setInputView(keyboard());
                      return;
                  }
                  if (key.equals("SPACE")) key = " ";
                  if (key.equals("↵")) key = "\n";
                  if (key.equals("⌫")) {
                      if (ic != null) ic.deleteSurroundingText(1, 0);
                      return;
                  }
                  if (ic != null) ic.commitText(key, 1);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luri-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
