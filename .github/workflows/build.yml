name: Build Lurish Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/lurish/keyboard
          mkdir -p app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Lurish'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.lurish.keyboard'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.lurish.keyboard'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Lurish</string>
              <string name="ime_name">Lurish - Northern Luri</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/method.xml <<'EOF'
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsSwitchingToNextInputMethod="true"
              android:isDefault="false" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".SettingsActivity"
                      android:label="Lurish Settings"
                      android:exported="true" />
                  <service
                      android:name=".LurishIME"
                      android:label="@string/ime_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lurish/keyboard/SettingsActivity.java <<'EOF'
          package com.lurish.keyboard;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.Button;

          public class SettingsActivity extends Activity {
              private SharedPreferences prefs;
              private LinearLayout root;
              private final int bg = Color.rgb(250, 225, 230);
              private final int ink = Color.rgb(35, 31, 32);

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("lurish", MODE_PRIVATE);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 24, 28, 24);
                  root.setBackgroundColor(bg);

                  TextView title = new TextView(this);
                  title.setText("Lurish Settings");
                  title.setTextColor(ink);
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  addSlider("Keyboard height", "height", 220, 340, 270, "dp");
                  addSlider("Key size", "keyHeight", 32, 48, 38, "dp");
                  addSlider("Key spacing", "spacing", 0, 5, 2, "dp");
                  addSlider("Pink accent intensity", "pink", 1, 10, 6, "/10");

                  addSwitch("Show number row", "numbers", true);
                  addSwitch("Show toolbar", "toolbar", true);
                  addSwitch("Show key labels in Latin layout", "latinLabels", true);

                  Button reset = new Button(this);
                  reset.setText("Reset settings");
                  reset.setOnClickListener(v -> {
                      prefs.edit().clear().apply();
                      recreate();
                  });
                  root.addView(reset);
                  setContentView(root);
              }

              private void addSlider(String label, String key, int min, int max,
                                     int def, String suffix) {
                  TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextColor(ink);
                  t.setTextSize(16);
                  root.addView(t);
                  SeekBar bar = new SeekBar(this);
                  bar.setMax(max - min);
                  bar.setProgress(prefs.getInt(key, def) - min);
                  TextView value = new TextView(this);
                  value.setText((min + bar.getProgress()) + " " + suffix);
                  value.setTextColor(ink);
                  bar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean user) {
                          int v = min + p;
                          value.setText(v + " " + suffix);
                          if (user) prefs.edit().putInt(key, v).apply();
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  root.addView(bar);
                  root.addView(value);
              }

              private void addSwitch(String label, String key, boolean def) {
                  Switch sw = new Switch(this);
                  sw.setText(label);
                  sw.setTextColor(ink);
                  sw.setChecked(prefs.getBoolean(key, def));
                  sw.setPadding(0, 8, 0, 8);
                  sw.setOnCheckedChangeListener((button, checked) ->
                      prefs.edit().putBoolean(key, checked).apply());
                  root.addView(sw);
              }
          }
          EOF

          cat > app/src/main/java/com/lurish/keyboard/LurishIME.java <<'EOF'
          package com.lurish.keyboard;

          import android.inputmethodservice.InputMethodService;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.InputConnection;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import java.text.Normalizer;

          public class LurishIME extends InputMethodService {
              private static final int BG = Color.rgb(250, 225, 230);
              private static final int KEY = Color.rgb(255, 255, 255);
              private static final int INK = Color.rgb(32, 30, 32);
              private static final int BORDER = Color.rgb(235, 211, 216);
              private static final int PINK = Color.rgb(224, 125, 149);
              private static final int PINK_DARK = Color.rgb(202, 87, 119);
              private boolean latinMode = false;
              private boolean symbolMode = false;
              private LinearLayout root, keysArea;
              private SharedPreferences prefs;

              private static final String[][] MAP = {
                  {"ا","a"},{"ب","b"},{"پ","p"},{"ت","t"},{"ج","c"},
                  {"چ","ç"},{"خ","x"},{"د","d"},{"ر","r"},{"ز","z"},
                  {"ژ","j"},{"س","s"},{"ش","ş"},{"غ","q"},{"ف","f"},
                  {"ق","q̇"},{"ل","l"},{"م","m"},{"ن","n"},{"و","o"},
                  {"ه","h"},{"ی","y"},{"ک","k"},{"گ","g"},{"ڡ","oo"},
                  {"ڢ","w"},{"ڤ","v"},{"ڶ","ll"},{"ڹ","ŋ"},{"ۏ","ů"},
                  {"ݕ","ee"},{"ݖ","ǝǝ"},{"ݢ","ḳ"},{"ٮ","ǝ"},
                  {"د̣","ḍ"},{"ی̇","i"},{"وو","u"},{"ا̇","aa"},{"ڔ","rr"}
              };

              @Override public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("lurish", MODE_PRIVATE);
              }

              @Override public View onCreateInputView() { return buildKeyboard(); }

              private int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private int setting(String k, int def) { return prefs.getInt(k, def); }
              private boolean enabled(String k, boolean def) { return prefs.getBoolean(k, def); }
              private int accent() {
                  int level = setting("pink", 6);
                  return Color.rgb(255 - level * 4, 220 - level * 8, 228 - level * 5);
              }

              private GradientDrawable background(int color, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radius));
                  d.setStroke(dp(1), BORDER);
                  return d;
              }

              private LinearLayout row() {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER);
                  return r;
              }

              private Button makeButton(String label, int color, Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(INK);
                  b.setTextSize(18);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setPadding(dp(1), 0, dp(1), 0);
                  b.setBackground(background(color, 7));
                  b.setElevation(dp(1.5f));
                  b.setOnClickListener(v -> action.run());
                  return b;
              }

              private void key(LinearLayout row, String label, String output,
                               int color, float weight) {
                  Button b = makeButton(label, color, () -> commit(output));
                  b.setTextSize(label.length() > 2 ? 15 : 20);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      0, dp(setting("keyHeight", 38)), weight);
                  int gap = setting("spacing", 2);
                  p.setMargins(dp(gap), dp(1), dp(gap), dp(1));
                  row.addView(b, p);
              }

              private void action(LinearLayout row, String label, int color,
                                 float weight, Runnable task) {
                  Button b = makeButton(label, color, task);
                  b.setTextSize(label.length() > 5 ? 12 : 17);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      0, dp(setting("keyHeight", 38)), weight);
                  int gap = setting("spacing", 2);
                  p.setMargins(dp(gap), dp(1), dp(gap), dp(1));
                  row.addView(b, p);
              }

              private void commit(String s) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) ic.commitText(s, 1);
              }

              private void delete() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  CharSequence selected = ic.getSelectedText(0);
                  if (selected != null && selected.length() > 0) {
                      ic.commitText("", 1);
                      return;
                  }
                  CharSequence before = ic.getTextBeforeCursor(32, 0);
                  if (before == null || before.length() == 0) {
                      ic.deleteSurroundingText(1, 0);
                      return;
                  }
                  String s = before.toString();
                  int count = 1;
                  String[] sequences = {"ǝǝ","q̇","د̣","ی̇","ا̇","وو","oo","ll","ee","aa","rr"};
                  boolean matched = false;
                  for (String seq : sequences) {
                      if (s.endsWith(seq)) {
                          count = seq.length();
                          matched = true;
                          break;
                      }
                  }
                  if (!matched) {
                      int end = s.length();
                      int i = end;
                      int cp = s.codePointBefore(i);
                      count = Character.charCount(cp);
                      i -= count;
                      while (i > 0) {
                          int prev = s.codePointBefore(i);
                          int type = Character.getType(prev);
                          if (type == Character.NON_SPACING_MARK ||
                              type == Character.COMBINING_SPACING_MARK ||
                              type == Character.ENCLOSING_MARK) {
                              int n = Character.charCount(prev);
                              count += n;
                              i -= n;
                          } else break;
                      }
                  }
                  ic.deleteSurroundingText(count, 0);
              }

              private void openSettings() {
                  Intent i = new Intent(this, SettingsActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(i);
              }

              private void paste() {
                  ClipboardManager cm = (ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null && cm.hasPrimaryClip()) {
                      ClipData clip = cm.getPrimaryClip();
                      if (clip != null && clip.getItemCount() > 0) {
                          CharSequence c = clip.getItemAt(0).coerceToText(this);
                          if (c != null) commit(c.toString());
                      }
                  }
              }

              private View buildKeyboard() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  int pad = dp(3);
                  root.setPadding(pad, pad, pad, pad);

                  if (enabled("toolbar", true)) {
                      LinearLayout tools = row();
                      action(tools, "☷", accent(), 1, () -> { symbolMode = !symbolMode; refresh(); });
                      action(tools, "▤", KEY, 1, this::paste);
                      action(tools, "☺", KEY, 1, () -> commit("😊"));
                      action(tools, "⚙", KEY, 1, this::openSettings);
                      action(tools, latinMode ? "Latin" : "Luri", accent(), 1.5f,
                          () -> { latinMode = !latinMode; symbolMode = false; refresh(); });
                      action(tools, "🌐", KEY, 1, () -> {
                          try { switchToNextInputMethod(false); } catch (Exception ignored) {}
                      });
                      root.addView(tools);
                  }

                  if (enabled("numbers", true)) {
                      LinearLayout nums = row();
                      for (String n : new String[]{"1","2","3","4","5","6","7","8","9","0"})
                          key(nums, n, n, KEY, 1);
                      root.addView(nums);
                  }

                  keysArea = new LinearLayout(this);
                  keysArea.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams area = new LinearLayout.LayoutParams(
                      -1, 0, 1);
                  root.addView(keysArea, area);

                  buildRows();

                  LinearLayout bottom = row();
                  action(bottom, "?123", accent(), 1.15f, () -> { symbolMode = !symbolMode; refresh(); });
                  action(bottom, "☺", accent(), 0.8f, () -> commit("😊"));
                  action(bottom, ",", KEY, 0.65f, () -> commit(","));
                  action(bottom, "space", KEY, 3.2f, () -> commit(" "));
                  action(bottom, ".", KEY, 0.65f, () -> commit("."));
                  action(bottom, "⌫", accent(), 1.0f, this::delete);
                  action(bottom, "↵", PINK_DARK, 1.0f, () -> {
                      InputConnection ic = getCurrentInputConnection();
                      if (ic != null) ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN,
                          KeyEvent.KEYCODE_ENTER));
                  });
                  root.addView(bottom);
                  return root;
              }

              private void refresh() {
                  setInputView(buildKeyboard());
              }

              private void buildRows() {
                  keysArea.removeAllViews();
                  if (symbolMode) {
                      String[][] rows = {
                          {"!","@","#","$","%","&","*","-","+"},
                          {"(",")","[","]","{","}","/","\\","="},
                          {",",".","?",";",":","…","_","ـ","'"}
                      };
                      for (String[] rr : rows) {
                          LinearLayout r = row();
                          for (String s : rr) key(r, s, s, KEY, 1);
                          keysArea.addView(r);
                      }
                      LinearLayout extra = row();
                      action(extra, "ABC", accent(), 1, () -> { symbolMode = false; refresh(); });
                      action(extra, "ZWNJ", accent(), 1.2f, () -> commit("\u200C"));
                      action(extra, "Tilde ـ", accent(), 1.4f, () -> commit("ـ"));
                      keysArea.addView(extra);
                      return;
                  }

                  if (!latinMode) {
                      String[][] rows = {
                          {"ا","ب","پ","ت","ج","چ","خ","د","ر","ز"},
                          {"ژ","س","ش","غ","ف","ق","ل","م","ن","و"},
                          {"ه","ی","ک","گ","ڡ","ڢ","ڤ","ڶ","ڹ","ۏ"},
                          {"ݕ","ݖ","ݢ","ٮ","د̣","ی̇","وو","ا̇","ڔ"}
                      };
                      for (String[] rr : rows) {
                          LinearLayout r = row();
                          for (String s : rr) key(r, s, s, KEY, 1);
                          keysArea.addView(r);
                      }
                      LinearLayout extra = row();
                      action(extra, "ZWNJ", accent(), 1.2f, () -> commit("\u200C"));
                      action(extra, "Tilde ـ", accent(), 1.5f, () -> commit("ـ"));
                      action(extra, "؟", KEY, 0.8f, () -> commit("؟"));
                      action(extra, "؛", KEY, 0.8f, () -> commit("؛"));
                      keysArea.addView(extra);
                  } else {
                      String[][] rows = {
                          {"q̇","w","e","r","t","y","u","i","o","p"},
                          {"a","s","d","f","g","h","j","k","l"},
                          {"ç","ş","x","c","z","v","b","n","m"},
                          {"oo","ll","ee","ǝǝ","aa","rr","ŋ","ů","ḳ","ḍ","ǝ"}
                      };
                      for (String[] rr : rows) {
                          LinearLayout r = row();
                          for (String s : rr) key(r, s, s, KEY, 1);
                          keysArea.addView(r);
                      }
                      LinearLayout extra = row();
                      action(extra, "ZWNJ", accent(), 1.2f, () -> commit("\u200C"));
                      action(extra, "Tilde ـ", accent(), 1.5f, () -> commit("ـ"));
                      action(extra, "?", KEY, 0.8f, () -> commit("?"));
                      action(extra, ";", KEY, 0.8f, () -> commit(";"));
                      keysArea.addView(extra);
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lurish-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
